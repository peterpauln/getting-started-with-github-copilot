jobs:
  export-secrets:
    runs-on: ubuntu-latest
    env:
      SECRET_ONE: ${{ secrets.SECRET_ONE }}
      SECRET_TWO: ${{ secrets.SECRET_TWO }}
      # Voeg hier meer secrets toe indien nodig
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installeer Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible


      - name: Maak secrets bestand aan via loop
        run: |
          for secret in SECRET_ONE SECRET_TWO; do
            value="${!secret}"
            if [ -z "$value" ]; then
              echo "$secret is niet gezet als secret in deze repository."
              exit 1
            fi
            echo "${secret,,}: $value" >> secrets.yml
          done

      - name: Versleutel met Ansible Vault
        env:
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
        run: |
          echo "$VAULT_PASSWORD" > vault_pass.txt
          ansible-vault encrypt secrets.yml --vault-password-file vault_pass.txt

      - name: Push naar andere repository
        env:
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
          TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git clone https://x-access-token:$TARGET_TOKEN@github.com/$TARGET_REPO target-repo
          cp secrets.yml target-repo/
          cd target-repo
          git add secrets.yml
          git commit -m "Update ansible vaulted secrets"
          git push

