      - name: Zet secret-namen in GITHUB_ENV variabele
        run: |
          echo "SECRET_NAMES=$(jq -r '.secrets[].name' response.json | xargs)" >> $GITHUB_ENV

      - name: Loop door de secret-namen uit GITHUB_ENV
        run: |
          for secret in $SECRET_NAMES; do
            echo "Secret gevonden: $secret"
            # Hier kun je acties uitvoeren per secret
          done
